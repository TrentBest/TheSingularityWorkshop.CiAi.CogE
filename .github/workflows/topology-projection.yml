name: CogE topology projection

on:
  push:
    branches: [development, master]
  pull_request:
    branches: [development]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/dotnet/sdk:8.0
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build topology projection
        run: dotnet build src/CiAi.CogE/CiAi.CogE.csproj --configuration Release
      - name: Run offline projection checks
        run: dotnet run --project tests/CiAi.CogE.Tests/CiAi.CogE.Tests.csproj --configuration Release
